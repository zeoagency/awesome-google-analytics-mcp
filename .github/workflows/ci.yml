name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes markdownlint-cli2@latest "**/*.md"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run repository integrity and count verification
        run: |
          pip install pytest pyyaml
          pytest tests/
